name: Sync race data

# Pre-renders every race's charts + metadata and commits them to the repo,
# so the static GitHub Pages build serves them as files instead of doing a
# live FastF1 load per request — that live load was the one thing that ever
# strained the old free-tier host. See src/plots.py's ensure_race_cached()
# for the read side of this.
#
# Idempotent: a race that's already fully cached is skipped (a couple of
# Path.exists() checks), so running this repeatedly — every week, or
# re-running an interrupted backfill — only does work for what's actually
# missing.

on:
  schedule:
    # Every Wednesday, 12:00 UTC. Races run on Sundays; this gives a
    # couple of days' buffer for official timing corrections to settle.
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      years:
        description: "Years to sync, space-separated (e.g. '2018 2019'). Leave blank for 2018-current (the full backfill)."
        required: false

permissions:
  contents: write

concurrency:
  # A full 2018-current backfill can run for hours; make sure a scheduled
  # run during that window queues instead of racing it on the same branch.
  group: sync-race-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine years to sync
        id: years
        shell: bash
        # The manual input reaches the script as an environment variable, never
        # pasted into the script text, so it can't be run as shell code. Each
        # entry must also be a plain year from 2018 to the current one, or the
        # run stops before doing anything.
        env:
          YEARS_INPUT: ${{ github.event.inputs.years }}
        run: |
          current_year=$(date -u +%Y)
          if [ -n "$YEARS_INPUT" ]; then
            list=""
            for y in $YEARS_INPUT; do
              if ! [[ "$y" =~ ^[0-9]{4}$ ]] || (( y < 2018 || y > current_year )); then
                echo "::error::Invalid year '$y' — use space-separated years from 2018 to $current_year"
                exit 1
              fi
              list="$list $y"
            done
            echo "list=${list# }" >> "$GITHUB_OUTPUT"
          else
            echo "list=$(seq 2018 "$current_year" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: Precache each year, committing progress as it goes
        shell: bash
        env:
          YEARS: ${{ steps.years.outputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for year in $YEARS; do
            echo "::group::Year $year"
            python -m src.precache "$year" || echo "::warning::$year had failures — will retry next run"
            echo "::endgroup::"

            git add static/plots/
            if ! git diff --cached --quiet; then
              git commit -m "Sync race data for $year"

              # A years-long backfill runs for hours, and this job's own
              # checkout is only as fresh as when it started — an unrelated
              # push elsewhere to main (a manual commit, say) in the
              # meantime makes `git push` reject as non-fast-forward. Rebase
              # onto whatever's now on the remote before pushing. This job
              # only ever touches static/plots/, so a genuine conflict here
              # would be surprising — but if one happens, don't let it take
              # the rest of the backfill down with it: abort that one
              # rebase and move on, rather than letting the default
              # errexit behavior kill the whole step (and every remaining
              # year) over one bad push.
              if ! git pull --rebase --autostash; then
                echo "::warning::Rebase conflict syncing $year — skipping, will retry next run"
                git rebase --abort
                continue
              fi
              if ! git push; then
                echo "::warning::Push failed for $year — will retry next run"
              fi
            fi
          done
