name: Deploy to GitHub Pages

# Rebuilds and redeploys the static site on every push to main — the same
# "push triggers a deploy" behavior the old Render setup had, just for a
# static build instead of a live server. Picks up both regular code/
# template pushes and the weekly sync workflow's data commits, since both
# land on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python -m src.build_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
