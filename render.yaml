services:
  - name: f1-snapshot
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT src.app:app
    buildFilter:
      ignoredPaths:
        - "scripts/**"
        - "*.md"
        - ".vscode/**"
        - ".claude/**"
        - ".gitignore"
