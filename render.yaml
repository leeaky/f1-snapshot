services:
  - name: f1-snapshot
    type: web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # gunicorn's own worker timeout defaults to 30s ("workers silent longer
    # than this are killed and restarted") — far short of the 30-90s (up to
    # ~3min cold) a first fetch of an uncached race can take. Render's own
    # proxy allows responses up to 100 minutes, so this was the actual
    # ceiling. 300s comfortably covers the documented worst case.
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 300 src.app:app
    buildFilter:
      ignoredPaths:
        - "scripts/**"
        - "*.md"
        - ".vscode/**"
        - ".claude/**"
        - ".gitignore"
